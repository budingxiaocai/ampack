name: Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/ampack dist/ampack
          cp LICENSE dist/LICENSE

          tar -C dist \
            -czf ampack-linux-x86_64.tar.gz \
            ampack LICENSE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ampack-linux-x86_64
          path: ampack-linux-x86_64.tar.gz
          if-no-files-found: error
